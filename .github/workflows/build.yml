name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac -- --universal --publish never
          - os: windows-latest
            command: npm run dist:win -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        if: matrix.os == 'macos-latest'
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BK-Prompter-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-Setup.exe
      - name: Attach platform installer immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release upload "${GITHUB_REF_NAME}" dist/*-Setup.exe --clobber --repo "${GITHUB_REPOSITORY}"
          fi
